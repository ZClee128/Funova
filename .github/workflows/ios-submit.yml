name: iOS Build & App Store Submit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: '要运行的 fastlane lane（默认上传现成 IPA）'
        required: true
        default: 'upload_ipa'
        type: choice
        options:
          - upload_ipa
          - submit_existing_build
          - resubmit_with_info

jobs:
  submit:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Upload & Submit to App Store Connect
        env:
          APPSTORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
        run: bundle exec fastlane ios ${{ github.event.inputs.lane || 'upload_ipa' }}
